name: Release

on:
  push:
    tags:
      - 'v*' # 标签触发
  workflow_dispatch: # 手动触发构建

# 同一个 ref 的构建不并发，避免两个 run 同时往一个 Release 传产物
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(grep -m1 '^version:' pubspec.yaml)"
          version_line="${version_line#version:}"
          version_line="${version_line//[[:space:]]/}"
          pubspec_version="${version_line%%+*}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$pubspec_version" ]]; then
              echo "::error title=Version mismatch::tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${pubspec_version}"
              exit 1
            fi
            version="$tag_version"
          else
            version="$pubspec_version"
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Decant $version"

  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs: [prepare, test]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Build
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "decant-$version-windows-x64.zip" `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: decant-*-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: [prepare, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libjson-glib-dev
      - uses: ./.github/actions/setup-flutter
      - name: Build
        run: flutter build linux --release
      - name: Package
        run: |
          version="${{ needs.prepare.outputs.version }}"
          tar -czf "decant-${version}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: decant-*-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS and iOS
    runs-on: macos-latest
    needs: [prepare, test]
    # iOS / macOS 的脚手架还没在真机上验证过，先不让它堵住发布；
    # 第一次跑通后删掉这一行，缺失就应该是失败的
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Build macOS
        run: flutter build macos --release
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package
        run: |
          version="${{ needs.prepare.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Decant.app \
            "decant-${version}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            "decant-${version}-ios-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: decant-*-macos-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: decant-*-ios-unsigned.zip
          if-no-files-found: error

  android:
    name: Android debug
    runs-on: ubuntu-latest
    needs: [prepare, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Build debug APK
        # 还没有自己的签名证书，先用 debug 签名
        run: flutter build apk --debug
      - name: Package
        run: |
          version="${{ needs.prepare.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "decant-${version}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: decant-*-android-debug.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [prepare, windows, linux, macos, android]
    # 只在打 tag 时发布；macOS / iOS 允许失败，Windows / Linux / Android 必须成功
    if: |
      !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && needs.windows.result == 'success'
      && needs.linux.result == 'success'
      && needs.android.result == 'success'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Decant ${{ needs.prepare.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
