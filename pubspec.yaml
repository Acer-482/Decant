name: media_transcoder
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  
  intl: ^0.20.3
  path: ^1.9.1 # 路径处理
  uuid: ^4.6.0 # UUID 生成
  flutter_animate: ^4.5.2 # 动画
  file_picker: ^13.1.0 # 文件选择
  desktop_drop: ^0.8.4 # 文件拖拽
  url_launcher: ^6.3.3 # URL 跳转/启动

  # 状态管理
  provider: ^6.1.5+1 # Provider
  flutter_riverpod: ^3.4.3 # Riverpod
  riverpod_annotation: ^4.0.7 # Riverpod 注解

  # 序列化代码生成
  freezed_annotation: ^3.1.0 # Freezed 注解
  dart_mappable: ^4.7.0 # 映射生成包

  # FFmpeg
  ffmpeg_kit_flutter_new: ^4.6.7 # FFmpeg 全量包

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.15.0 # 代码生成

  # 序列化代码生成
  freezed: ^4.0.2 # freezed
  riverpod_generator: ^4.0.3 # Riverpod
  dart_mappable_builder: ^4.7.0 # 映射生成

flutter:
  uses-material-design: true
